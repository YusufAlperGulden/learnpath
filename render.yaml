# Render 1-Click Cloud Blueprint (https://dashboard.render.com/blueprints)
# Deploys PostgreSQL + FastAPI API + React SPA under one unified public HTTPS URL.

databases:
  - name: learnpath-db
    databaseName: learnpath_db
    user: learnpath
    plan: free

services:
  - type: web
    name: learnpath
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnpath-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MASTERY_THRESHOLD_PERCENT
        value: "70.0"
      - key: SEED_INTERACTION_COHORT
        value: "true"
