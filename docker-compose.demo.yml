services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnpath_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-learnpath_db}
    volumes:
      - learnpath_demo_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-learnpath} -d $${POSTGRES_DB:-learnpath_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learnpath}:${POSTGRES_PASSWORD:-learnpath_dev_pass}@postgres:5432/${POSTGRES_DB:-learnpath_db}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learnpath}:${POSTGRES_PASSWORD:-learnpath_dev_pass}@postgres:5432/learnpath_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-learnpath-portable-demo-jwt-secret-key-2026}
      MASTERY_THRESHOLD_PERCENT: "70.0"
      SEED_INTERACTION_COHORT: "true"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  learnpath_demo_pgdata:
