[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Actual DATABASE_URL is injected dynamically from app.core.config.settings in alembic/env.py
sqlalchemy.url = postgresql+psycopg://learnpath:learnpath_dev_pass@localhost:5432/learnpath_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
